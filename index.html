<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Wheel of Origin — Tournament</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Cinzel+Decorative:wght@400;700;900&family=MedievalSharp&display=swap');

  *, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;      /* kills double-tap zoom on fast repeat taps */
    -webkit-user-select: none;       /* no blue selection on a long press */
    user-select: none;
    -webkit-touch-callout: none;     /* no "Save Image" sheet on the wheel */
  }

  /* The roster fields still need normal text behaviour. */
  input, textarea, select, [contenteditable] {
    -webkit-user-select: text; user-select: text; -webkit-touch-callout: default;
  }

  /* Explicit as well as via the universal rule: on the recording surfaces this
     must hold even if a browser resolves the cascade differently. */
  #app, #stage, #wheel-stage, #reel-stage, #vs-stage, #winner-stage,
  #wheel-canvas, #fighter-bar, #header-center, #locator, #action-btn,
  .reel-row, .reel-name, .reel-race, .fb-name, #fb-score, .vs-name {
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  canvas, img { -webkit-user-drag: none; pointer-events: auto; }

  :root {
    --bg: #000000; --bg2: #111111; --bg3: #1a1a1a; --bg4: #222222;
    --border: #333333; --border2: #444444;
    --accent: #c8980a; --accent2: #d4a820;
    --text: #ffffff; --text2: #aaaaaa; --text3: #666666;
    --nav-bg: #161616;
    --gold-line: rgba(200,160,50,0.55);
  }

  html, body {
    width: 100%; height: 100%;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
    background: var(--bg);
    font-family: 'Nunito', system-ui, -apple-system, sans-serif;
    color: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased;
  }

  #app {
    width: 100%; max-width: 430px;
    height: 100dvh; min-height: 100vh;   /* vh fallback where dvh is missing */
    margin: 0 auto;
    display: flex; flex-direction: column; position: relative;
    background: var(--bg); overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .gold-text {
    background-clip: text; -webkit-background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    background-image: linear-gradient(180deg, #fffbe8 0%, #f0d878 20%, #c8980a 45%, #e8c84a 60%, #a07008 75%, #d4a820 90%, #f5e080 100%);
    filter: drop-shadow(0 0 8px rgba(200,155,20,0.4));
  }

  /* ── LOCATOR (one line, tappable) ─────────────────────────── */
  #locator {
    flex-shrink: 0; margin: 22px 12px 0; padding: 8px 4px; text-align: center;
    border-top: 1px solid rgba(160,120,30,0.3);
    border-bottom: 1px solid rgba(160,120,30,0.3);
    cursor: pointer;
    font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 900;
    letter-spacing: 3.4px; text-transform: uppercase;
    color: rgba(212,168,32,0.92);
  }
  #locator:active { background: rgba(24,17,4,0.6); }

  /* ── HEADER ────────────────────────────────────────────────── */
  #header-center {
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 12px 0; flex-shrink: 0;
  }
  #phase-eyebrow {
    font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 900;
    letter-spacing: 5px; text-transform: uppercase;
    color: rgba(200,165,80,0.8); min-height: 18px;
  }
  #phase-title {
    font-family: 'Cinzel Decorative', serif; font-size: 25px; font-weight: 900;
    letter-spacing: 1.4px; text-transform: uppercase; text-align: center;
    line-height: 1.12; margin-top: 5px; white-space: nowrap;
  }
  #phase-sub {
    font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800;
    letter-spacing: 2.6px; text-transform: uppercase;
    color: var(--text3); text-align: center; margin-top: 4px;
    min-height: 17px;   /* reserved: an empty sub must not collapse the header */
  }

  /* ── FIGHTER BAR (names + score + dots, above the wheel) ───── */
  #fighter-bar { width: 100%; max-width: 400px; flex-shrink: 0; margin-bottom: 10px; }
  #fb-names { display: flex; align-items: center; gap: 10px; }
  .fb-name {
    flex: 1; min-width: 0; font-family: 'Cinzel Decorative', serif;
    font-size: 20px; font-weight: 900; line-height: 1.1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .fb-name.r { text-align: right; }
  .fb-name.pulse { animation: namePulse 0.9s ease-out both; }
  @keyframes namePulse {
    0%   { transform: scale(1); }
    22%  { transform: scale(1.11); }
    100% { transform: scale(1); }
  }
  #fb-score {
    flex-shrink: 0; font-family: 'Cinzel Decorative', serif;
    font-size: 20px; font-weight: 900; letter-spacing: 1px;
    color: var(--accent2); min-width: 62px; text-align: center;
  }
  #fb-dots { display: flex; justify-content: center; gap: 11px; margin-top: 9px; }
  #fb-dots.five { gap: 8px; }
  #fb-dots.five .rdot { width: 13px; height: 13px; }
  .rdot {
    width: 17px; height: 17px; border-radius: 50%;
    background: #131313; border: 2px solid rgba(120,95,30,0.55);
    transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
  }
  .rdot.filled { border-color: rgba(255,255,255,0.4); }
  .rdot.justfilled { animation: dotPop 0.55s cubic-bezier(0.34,1.56,0.64,1) both; }
  @keyframes dotPop { 0% { transform: scale(0.5); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }

  /* ── STAGE ────────────────────────────────────────────────── */
  #stage {
    flex: 1; min-height: 0; position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 6px 12px 0;
  }

  /* ── SLOT REEL ─────────────────────────────────────────────── */
  #reel-stage { width: 100%; display: none; flex-direction: column; align-items: center; }
  #reel-frame {
    position: relative; width: 100%; max-width: 360px; height: 258px; overflow: hidden;
    background: linear-gradient(180deg, #070603 0%, #120c04 50%, #070603 100%);
    border: 2px solid var(--gold-line); border-radius: 6px;
    box-shadow: inset 0 0 34px rgba(0,0,0,0.95), 0 0 18px rgba(160,120,25,0.18);
  }
  #reel-inner-border {
    position: absolute; inset: 4px; border: 1px solid rgba(140,105,25,0.35);
    border-radius: 3px; pointer-events: none; z-index: 6;
  }
  #reel-strip { position: absolute; top: 0; left: 0; width: 100%; will-change: transform; }
  .reel-row {
    height: 86px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; padding: 0 14px; overflow: hidden;
  }
  .reel-name {
    font-family: 'Cinzel Decorative', serif; font-size: 22px; font-weight: 700;
    letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%; text-align: center; line-height: 1.15; text-shadow: 0 2px 6px rgba(0,0,0,1);
  }
  .reel-race {
    font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 800;
    letter-spacing: 2.6px; text-transform: uppercase; opacity: 0.92;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  #reel-mask {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
    background: linear-gradient(180deg,
      rgba(3,2,1,0.97) 0%, rgba(3,2,1,0.78) 13%, rgba(3,2,1,0.10) 30%,
      rgba(3,2,1,0) 50%, rgba(3,2,1,0.10) 70%, rgba(3,2,1,0.78) 87%, rgba(3,2,1,0.97) 100%);
  }
  #reel-band {
    position: absolute; left: 0; right: 0; top: 86px; height: 86px; z-index: 3; pointer-events: none;
    border-top: 1px solid rgba(220,180,70,0.55); border-bottom: 1px solid rgba(220,180,70,0.55);
    background: linear-gradient(180deg, rgba(200,155,20,0.09), rgba(200,155,20,0.02) 50%, rgba(200,155,20,0.09));
  }
  #reel-band::before, #reel-band::after {
    content: ''; position: absolute; top: 50%; width: 0; height: 0;
    border-top: 7px solid transparent; border-bottom: 7px solid transparent; transform: translateY(-50%);
  }
  #reel-band::before { left: 0; border-left: 9px solid rgba(220,180,70,0.85); }
  #reel-band::after  { right: 0; border-right: 9px solid rgba(220,180,70,0.85); }
  #reel-flash {
    position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,225,140,0.42) 0%, rgba(255,200,60,0.14) 38%, rgba(255,190,40,0) 70%);
  }
  #reel-flash.lock { animation: reelLock 0.85s cubic-bezier(0.22,1,0.36,1) both; }
  @keyframes reelLock { 0% {opacity:0;} 12% {opacity:1;} 100% {opacity:0;} }
  #reel-frame.lock { animation: frameLock 0.7s ease-out both; }
  @keyframes frameLock {
    0%   { box-shadow: inset 0 0 34px rgba(0,0,0,0.95), 0 0 42px rgba(255,200,60,0.75); border-color: rgba(255,220,120,0.95); }
    100% { box-shadow: inset 0 0 34px rgba(0,0,0,0.95), 0 0 18px rgba(160,120,25,0.18); border-color: var(--gold-line); }
  }
  .reel-corner { position: absolute; width: 9px; height: 9px; z-index: 7; pointer-events: none; }
  .reel-corner i { display: block; width: 5px; height: 5px; background: rgba(210,170,60,0.8); transform: rotate(45deg); }
  .rc-tl { top: 7px; left: 7px; } .rc-tr { top: 7px; right: 7px; }
  .rc-bl { bottom: 7px; left: 7px; } .rc-br { bottom: 7px; right: 7px; }
  #reel-caption {
    margin-top: 13px; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 900;
    letter-spacing: 3px; text-transform: uppercase; color: var(--text3);
    min-height: 17px; text-align: center;
  }

  /* ── MATCHUP (VS) ──────────────────────────────────────────── */
  #vs-stage { display: none; flex-direction: column; width: 100%; max-width: 380px; }
  #vs-heads { display: flex; align-items: stretch; gap: 8px; margin-bottom: 16px; }
  #vs-stage.five #vs-heads { margin-bottom: 10px; }
  .vs-side { flex: 1; min-width: 0; text-align: center; }
  .vs-strip { height: 4px; border-radius: 2px; margin-bottom: 8px; }
  .vs-name {
    font-family: 'Cinzel Decorative', serif; font-size: 17px; font-weight: 900;
    line-height: 1.15; word-break: break-word; margin-bottom: 5px;
  }
  .vs-race {
    font-family: 'Nunito', sans-serif; font-size: 10px; font-weight: 800;
    letter-spacing: 1.8px; text-transform: uppercase; opacity: 0.85;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .vs-tier {
    display: inline-block; margin-top: 6px; padding: 3px 9px; border-radius: 3px;
    font-size: 9px; font-weight: 900; letter-spacing: 1.8px; text-transform: uppercase;
  }
  #vs-mid {
    flex-shrink: 0; width: 44px; display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel Decorative', serif; font-size: 20px; font-weight: 900;
  }
  .vs-trial { margin-bottom: 13px; }
  #vs-trials.five .vs-trial { margin-bottom: 7px; }
  #vs-trials.five .vs-val { font-size: 16px; }
  #vs-trials.five .vs-bar { height: 10px; }
  .vs-trial-head {
    display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 5px;
  }
  .vs-trial-name {
    font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 900;
    letter-spacing: 2.4px; text-transform: uppercase; color: var(--accent2);
  }
  .vs-trial-stats { font-size: 9.5px; font-weight: 800; letter-spacing: 1.6px; color: var(--text3); text-transform: uppercase; }
  .vs-bar-row { display: flex; align-items: center; gap: 9px; }
  .vs-val { font-size: 19px; font-weight: 900; width: 34px; flex-shrink: 0; }
  .vs-val.r { text-align: right; }
  .vs-bar {
    flex: 1; height: 12px; border-radius: 6px; overflow: hidden; display: flex;
    border: 1px solid rgba(255,255,255,0.10);
  }
  .vs-bar span { display: block; height: 100%; }

  /* ── WHEEL ─────────────────────────────────────────────────── */
  #wheel-stage { display: none; flex-direction: column; align-items: center; width: 100%; }
  #wheel-canvas { display: block; border-radius: 50%; }
  #wheel-values {
    margin-top: 11px; display: flex; align-items: center; justify-content: center; gap: 16px;
    text-shadow: 0 2px 6px rgba(0,0,0,1);
  }
  .wv-col { text-align: center; min-width: 62px; }
  .wv-num { font-size: 32px; font-weight: 900; line-height: 1; }
  .wv-pct { font-size: 11px; font-weight: 800; letter-spacing: 1.6px; color: var(--text3); margin-top: 3px; }
  .wv-vs { font-family: 'Cinzel Decorative', serif; font-size: 14px; color: var(--text3); letter-spacing: 2px; }

  /* ── WINNER ────────────────────────────────────────────────── */
  #winner-stage { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 0 8px; }
  #winner-crown { margin-bottom: 10px; }
  #winner-name {
    font-family: 'Cinzel Decorative', serif; font-size: 32px; font-weight: 900;
    letter-spacing: 1.5px; text-align: center; line-height: 1.12; margin-bottom: 8px;
  }
  #winner-race {
    font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 900;
    letter-spacing: 3px; text-transform: uppercase; margin-bottom: 20px; text-align: center;
  }
  #winner-score {
    font-family: 'Cinzel Decorative', serif; font-size: 44px; font-weight: 900;
    letter-spacing: 5px; margin-bottom: 8px;
  }
  #winner-detail {
    font-size: 11px; font-weight: 800; letter-spacing: 2.4px; text-transform: uppercase;
    color: var(--text3); text-align: center; line-height: 1.7;
  }

  /* ── ACTION ────────────────────────────────────────────────── */
  #action-row { flex-shrink: 0; padding: 10px 16px 8px; }
  #action-btn {
    width: 100%; height: 54px; border-radius: 27px;
    background: linear-gradient(180deg, #241a06, #140e03);
    border: 1px solid rgba(180,140,40,0.6); color: var(--accent2);
    font-family: 'Cinzel Decorative', serif; font-size: 14px; font-weight: 900;
    letter-spacing: 2.2px; text-transform: uppercase; cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
    box-shadow: 0 0 16px rgba(160,120,25,0.14), inset 0 1px 0 rgba(255,220,120,0.12);
  }
  #action-btn:active { transform: scale(0.985); }
  #action-btn:disabled { opacity: 0.35; cursor: default; }

  /* ── NAV ───────────────────────────────────────────────────── */
  #bottom-nav {
    margin: 0 12px 10px; background: var(--nav-bg); border: 1px solid var(--border);
    border-radius: 26px; display: flex; align-items: center; padding: 6px 4px; flex-shrink: 0; gap: 2px;
  }
  .nav-tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 4px; border-radius: 20px; cursor: pointer; transition: background 0.15s;
  }
  .nav-tab.active { background: var(--bg4); }
  .nav-tab svg { width: 19px; height: 19px; fill: none; stroke: var(--text3); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav-tab.active svg { stroke: var(--accent2); }
  .nav-label { font-size: 10px; font-weight: 800; letter-spacing: 0.4px; color: var(--text3); }
  .nav-tab.active .nav-label { color: var(--accent2); }

  /* ── CLEAN MODE (hides chrome for recording) ───────────────── */
  body.clean #bottom-nav { display: none; }
  body.clean #action-row { padding-bottom: 18px; }
  body.clean #action-btn { opacity: 0.25; height: 44px; }
  #clean-toggle {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 4px; z-index: 40;
    width: 40px; height: 40px; border-radius: 50%;   /* generous tap target */
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    opacity: 0.45; transition: opacity 0.25s;
  }
  #clean-toggle span {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(20,20,20,0.7); border: 1px solid #2c2c2c;
    display: flex; align-items: center; justify-content: center;
  }
  #clean-toggle svg { width: 14px; height: 14px; stroke: var(--text3); fill: none; stroke-width: 2; }
  /* Clean mode: invisible on camera, but the tap target stays live. */
  body.clean #clean-toggle { opacity: 0; }
  body.clean #clean-toggle span { background: transparent; border-color: transparent; }

  #back-zone {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 4px; z-index: 40;
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    opacity: 0.45; transition: opacity 0.25s;
  }
  #back-zone.off { opacity: 0.12; }
  #back-zone span {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(20,20,20,0.7); border: 1px solid #2c2c2c;
    display: flex; align-items: center; justify-content: center;
  }
  #back-zone svg { width: 14px; height: 14px; stroke: var(--text3); fill: none; stroke-width: 2.2; }
  body.clean #back-zone { opacity: 0; }
  body.clean #back-zone span { background: transparent; border-color: transparent; }

  #toast {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    z-index: 70; pointer-events: none; opacity: 0;
    background: rgba(14,10,3,0.92); border: 1px solid rgba(160,120,30,0.5);
    border-radius: 20px; padding: 9px 16px; max-width: 86%;
    font-size: 11.5px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--accent2); text-align: center; line-height: 1.5;
  }
  #toast.show { animation: toastFade 2.8s ease-out both; }
  @keyframes toastFade {
    0% { opacity: 0; transform: translate(-50%, 8px); }
    10% { opacity: 1; transform: translate(-50%, 0); }
    75% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ── PANELS ────────────────────────────────────────────────── */
  .panel { position: absolute; inset: 0; z-index: 60; background: var(--bg); display: none; flex-direction: column; }
  .panel-head {
    flex-shrink: 0; padding: 14px 16px 10px; display: flex; align-items: center;
    justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--border);
  }
  .panel-title { font-family: 'Cinzel Decorative', serif; font-size: 15px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
  .panel-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px 24px; }
  .panel-close {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: var(--bg3); border: 1px solid var(--border); color: var(--text2);
    font-size: 17px; line-height: 1; cursor: pointer;
  }

  .sec { margin-bottom: 22px; }
  .sec-label { font-size: 10px; font-weight: 900; letter-spacing: 2.4px; text-transform: uppercase; color: rgba(200,165,80,0.75); margin-bottom: 8px; }
  .hint { font-size: 11.5px; color: var(--text3); line-height: 1.6; margin-bottom: 8px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text2); }

  textarea, input[type=text], input[type=number], select {
    width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: 'Nunito', sans-serif; font-size: 13px; padding: 10px 11px; outline: none;
  }
  textarea:focus, input:focus, select:focus { border-color: rgba(180,140,40,0.7); }
  textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.55; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 42px; padding: 0 16px; border-radius: 21px; background: var(--bg3);
    border: 1px solid var(--border); color: var(--text);
    font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; cursor: pointer; transition: background 0.15s;
  }
  .btn:active { background: var(--bg4); }
  .btn.gold { border-color: rgba(180,140,40,0.6); color: var(--accent2); }
  .btn.danger { border-color: rgba(160,40,40,0.6); color: #ff6655; }
  .btn.full { width: 100%; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  .check-row {
    display: flex; align-items: flex-start; gap: 9px; margin: 10px 0 2px;
    font-size: 11.5px; line-height: 1.55; color: var(--text2); cursor: pointer;
  }
  .check-row input { width: 17px; height: 17px; flex-shrink: 0; margin-top: 1px; accent-color: #c8980a; }
  .msg { font-size: 12px; margin-top: 9px; line-height: 1.5; min-height: 16px; }
  .msg.ok { color: #66ee88; } .msg.err { color: #ff6655; } .msg.neutral { color: var(--text2); }

  .champ-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px;
    background: var(--bg2); border: 1px solid var(--border); margin-bottom: 7px; cursor: pointer;
  }
  .champ-row:active { background: var(--bg3); }
  .champ-idx { font-size: 10px; color: var(--text3); width: 24px; flex-shrink: 0; font-weight: 800; }

(function () {

// every match, so it stays readable when both share a rarity.
const SIDE = {

  // primaries — the crimson leans wine (OP red is cold and flat), the azure
  // leans indigo (Rare blue is a brighter royal).
  a: { seg: '#6d1420', mark: '#cf3a48', label: 'Crimson' },
  b: { seg: '#16345e', mark: '#4a7fd6', label: 'Azure' },
};

function sideMark(x) { return SIDE[x].mark; }

// The generator ranks Human as Common; this project treats the bottom two
// tiers one step higher. Trash -> Common, Common -> Uncommon, rest unchanged.
const TIER_SHIFT = { Trash: 'Common', Common: 'Uncommon' };
function shiftTier(t) { return TIER_SHIFT[t] || t; }

function tierColor(t) { return TIER_COLORS[t] || TIER_COLORS.Common; }
function tierGlow(t)  { return TIER_GLOW[t]   || TIER_GLOW.Common; }
function normTier(t) {
  if (!t) return 'Common';
  const s = String(t).trim().toLowerCase();
  for (const x of TIER_LIST) if (x.toLowerCase() === s) return x;
  if (s === 'none') return 'None';
  return 'Common';
}

// The stat pair itself is the headline — no invented labels to learn.

  { stats: ['SPD','DEF'], title: 'Speed + Defense' },
  { stats: ['STR','PM'],  title: 'Strength + Power Mastery' },
  { stats: ['STR','IQ','SPD','DUR','PM','DEF'], title: 'Total Power' },
];
// Spin order is shuffled per match. Best of three draws from the first three
// pairs only; best of five adds the fourth pair and always closes with Total
// Power, which has to stay last because it is the 2-2 decider.
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function makeOrder(n) {
  return n === 5 ? shuffled([0, 1, 2, 3]).concat([4]) : shuffled([0, 1, 2]);
}
function orderOf(m, n) {
  if (m && Array.isArray(m.order) && m.order.length === n) return m.order;
  const fallback = [];
  for (let i = 0; i < n; i++) fallback.push(i);
  return fallback;
}
function trialAt(m, ti, n) { return TRIALS[orderOf(m, n)[ti]]; }

function trialCountFor(size) { return size <= BO5_FROM_SIZE ? 5 : 3; }

  // A match already in progress keeps the format it was weighted with, so a
  // fight started under an older build can never run more spins than it has
  // odds for.
  if (m && Array.isArray(m.w) && m.w.length) return m.w.length;
  if (m && typeof m.nt === 'number') return m.nt;
  return trialCountFor(r ? r.size : 64);
}

}

let audioCtx = null, masterGain = null, muted = false;
let tickBuffer = null, landingBuffer = null, landingDecodeStarted = false, lastTickTime = 0;

function b64ToBuffer(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function initAudio() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  masterGain = audioCtx.createGain();
  masterGain.gain.value = muted ? 0 : MASTER_VOLUME;
  masterGain.connect(audioCtx.destination);
  audioCtx.decodeAudioData(b64ToBuffer(TICK_WAV_B64), b => { tickBuffer = b; }, () => {});
  preloadLanding();
}
function preloadLanding() {
  if (!audioCtx || landingDecodeStarted || landingBuffer) return;
  landingDecodeStarted = true;
  try {
    audioCtx.decodeAudioData(b64ToBuffer(LANDING_WAV_B64))
      .then(b => { landingBuffer = b; }).catch(() => { landingBuffer = null; });
  } catch (e) { landingBuffer = null; }
}
function playTick(intensity) {
  if (!audioCtx || muted || !tickBuffer) return;
  const now = performance.now();
  if (now - lastTickTime < MIN_TICK_INTERVAL) return;
  lastTickTime = now;
  const src = audioCtx.createBufferSource(), g = audioCtx.createGain();
  src.buffer = tickBuffer;
  g.gain.value = SPIN_TICK_VOLUME * intensity * 0.9;
  src.connect(g); g.connect(masterGain);
  src.start(audioCtx.currentTime);
}
function playSpinTick(sf) { playTick(0.55 + Math.min(1, sf == null ? 1 : sf) * 0.38); }
function playLanding() {
  if (!audioCtx || muted) return;
  preloadLanding();
  if (!landingBuffer) { [0,42,77,112,154].forEach((ms,i) => setTimeout(() => playTick(i === 4 ? 1.25 : 0.75), ms)); return; }
  const now = audioCtx.currentTime;
  const src = audioCtx.createBufferSource(), g = audioCtx.createGain();
  src.buffer = landingBuffer;
  g.gain.setValueAtTime(RESULT_SOUND_VOLUME * 1.35, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + landingBuffer.duration + 0.035);
  src.connect(g); g.connect(masterGain);
  src.start(now);
}

// ═══════════════════════════════════════════════════════════════════
// TOURNAMENT MODEL
// ═══════════════════════════════════════════════════════════════════
function roundFullName(n) {
  if (n === 2) return 'Final';
  if (n === 4) return 'Semi-Final';
  if (n === 8) return 'Quarter-Final';
  return 'Round of ' + n;
}
function roundShortName(n) {
  if (n === 2) return 'F';
  if (n === 4) return 'SF';
  if (n === 8) return 'QF';
  return String(n);
}

function makeRound(entrantIds) {
  const n = entrantIds.length;
  const matches = [];
  for (let i = 0; i < Math.floor(n / 2); i++) {
    matches.push({
      a: null, b: null, phase: 'idle', w: null, sums: null,
      nt: trialCountFor(n),
      res: [null, null, null, null, null],
      off: [0, 0, 0, 0, 0],
    });
  }
  return { size: n, name: roundFullName(n), entrants: entrantIds.slice(), pool: entrantIds.slice(), matches, byes: [] };
}

function startTournament() {
  if (champions.length < 2) return false;
  tourney = { v: STATE_VERSION, rounds: [makeRound(champions.map(c => c.id))], ri: 0, mi: 0 };
  save();
  return true;
}

function curRound() { return tourney ? tourney.rounds[tourney.ri] : null; }
function curMatch()  { const r = curRound(); return r ? r.matches[tourney.mi] : null; }

function computeMatchWeights(m, n) {
  const A = champById(m.a), B = champById(m.b);
  if (!A || !B) return;
  m.nt = n;
  m.order = makeOrder(n);
  const trials = m.order.map(i => TRIALS[i]);
  m.sums = trials.map(t => ({
    a: t.stats.reduce((s,k) => s + (Number(A[k]) || 0), 0),
    b: t.stats.reduce((s,k) => s + (Number(B[k]) || 0), 0),
  }));
  m.w = m.sums.map(s => {
    const a = Math.pow(Math.max(1, s.a), POWER_EXP);
    const b = Math.pow(Math.max(1, s.b), POWER_EXP);
    let share = a / (a + b);
    if (!isFinite(share)) share = 0.5;
    return Math.min(1 - MIN_SHARE, Math.max(MIN_SHARE, share));
  });
}

function matchScore(m) {
  let a = 0, b = 0;
  m.res.forEach(r => { if (r === 'a') a++; else if (r === 'b') b++; });
  return { a, b };
}
// A match stops the moment one side holds an unbeatable lead.
function winsNeeded(n) { return Math.floor(n / 2) + 1; }
function isDecided(m, n) {
  const s = matchScore(m);
  const need = winsNeeded(n);
  return s.a >= need || s.b >= need;
}

function matchWinnerId(m) {
  const s = matchScore(m);
  if (!s.a && !s.b) return null;
  return s.a > s.b ? m.a : m.b;
}
function allMatchesDone(r) { return r.matches.length > 0 && r.matches.every(m => m.phase === 'end'); }

function buildNextRoundIfReady() {
  const r = curRound();
  if (!r || !allMatchesDone(r)) return false;
  if (tourney.ri < tourney.rounds.length - 1) return false;
  const winners = r.matches.map(m => matchWinnerId(m)).filter(Boolean);
  r.byes = r.pool.slice();
  const next = winners.concat(r.byes);
  if (next.length < 2) return false;
  tourney.rounds.push(makeRound(next));
  return true;
}

// Planned round sizes, so the rail shows the whole road from the start
function plannedSizes() {
  if (!tourney) return [];
  let n = tourney.rounds[0].size, out = [];
  while (n >= 2) { out.push(n); n = Math.floor(n / 2); }
  return out;
}

// ═══════════════════════════════════════════════════════════════════
// SLOT REEL
// ═══════════════════════════════════════════════════════════════════
let reelPool = [], reelOffset = 0, reelAnim = null;

function offsetForRow(row) { return (row - 1) * ROW_H; }

function reelRow(c) {
  const row = document.createElement('div');
  row.className = 'reel-row';
  if (c) {
    const nm = document.createElement('div');
    nm.className = 'reel-name';
    nm.textContent = c.name;
    nm.style.color = tierGlow(c.tier);
    const rc = document.createElement('div');
    rc.className = 'reel-race';
    rc.textContent = (c.race || '\u2014') + ' \u00b7 ' + c.tier;
    rc.style.color = tierGlow(c.tier);
    rc.style.opacity = '0.8';
    row.appendChild(nm); row.appendChild(rc);
  }
  return row;
}

function buildReelStrip(poolIds, repeats) {
  const frag = document.createDocumentFragment();
  for (let r = 0; r < repeats; r++) {
    for (let i = 0; i < poolIds.length; i++) frag.appendChild(reelRow(champById(poolIds[i])));
  }
  reelStrip.innerHTML = '';
  reelStrip.appendChild(frag);
}

function setReelStatic(poolIds, id) {
  reelPool = poolIds.slice();
  if (!reelPool.length) { reelStrip.innerHTML = ''; return; }
  const repeats = Math.max(3, Math.ceil(9 / reelPool.length));
  buildReelStrip(reelPool, repeats);
  const idx = Math.max(0, reelPool.indexOf(id));
  const mid = Math.floor(repeats / 2) * reelPool.length + idx;
  reelOffset = offsetForRow(mid);
  reelStrip.style.transform = 'translate3d(0,' + (-reelOffset) + 'px,0)';
}

function showReelLocked(id) {
  const c = champById(id);
  reelStrip.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 3; i++) frag.appendChild(reelRow(i === 1 ? c : null));
  reelStrip.appendChild(frag);
  reelOffset = offsetForRow(1);
  reelStrip.style.transform = 'translate3d(0,' + (-reelOffset) + 'px,0)';
}

function spinReel(poolIds, targetId, onDone) {
  reelPool = poolIds.slice();
  const total = reelPool.length;
  if (!total) { onDone && onDone(); return; }

  const travelRows = Math.max(28, Math.min(180, total * 2));
  let loops = Math.ceil(travelRows / total);
  while ((loops + 3) * total > 420 && loops > 1) loops--;
  const repeats = loops + 3;
  buildReelStrip(reelPool, repeats);

  const targetIdx = Math.max(0, reelPool.indexOf(targetId));
  const endRow   = total + targetIdx;             // names travel downward
  const startRow = endRow + loops * total;
  const startOffset = offsetForRow(startRow);
  const endOffset   = offsetForRow(endRow);
  const dist = endOffset - startOffset;

  const duration = 3500 + Math.random() * 800;
  const t0 = performance.now();
  let lastRow = -1;

  reelStrip.style.transform = 'translate3d(0,' + (-startOffset) + 'px,0)';
  reelFrame.classList.remove('lock');
  reelFlash.classList.remove('lock');

  function frame(now) {
    const t = Math.min(1, (now - t0) / duration);
    const ease = 1 - Math.pow(1 - t, 3);
    reelOffset = startOffset + ease * dist;
    reelStrip.style.transform = 'translate3d(0,' + (-reelOffset) + 'px,0)';
    const row = Math.round(reelOffset / ROW_H);
    if (row !== lastRow) { lastRow = row; if (t > 0.01) playSpinTick(Math.min(1, (1 - ease) / 0.3)); }
    if (t < 1) { reelAnim = requestAnimationFrame(frame); }
    else {
      reelAnim = null;
      reelOffset = endOffset;
      reelStrip.style.transform = 'translate3d(0,' + (-endOffset) + 'px,0)';
      void reelFrame.offsetWidth;
      reelFrame.classList.add('lock');
      reelFlash.classList.add('lock');
      playLanding();
      onDone && onDone();
    }
  }
  reelAnim = requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════════════════
// TRIAL WHEEL — two segments, size = win chance
// ═══════════════════════════════════════════════════════════════════
let canvasSize = 320, segLayout = [], currentRotation = 0;
let wheelSpinning = false, winnerSeg = null, wheelRaf = null;

function buildTrialLayout(m, ti) {
  const A = champById(m.a), B = champById(m.b);
  const shareA = m.w ? m.w[ti] : 0.5;
  const spanA = shareA * 2 * Math.PI;
  segLayout = [
    { side:'a', label: A ? A.name : 'A', color: sideSeg('a'), startAngle: 0, endAngle: spanA,
      centerAngle: spanA / 2, weight: shareA },
    { side:'b', label: B ? B.name : 'B', color: sideSeg('b'), startAngle: spanA, endAngle: 2*Math.PI,
      centerAngle: spanA + (2*Math.PI - spanA) / 2, weight: 1 - shareA },
  ];
}

function getSegmentAtPointer(layout, rotation) {
  const PI2 = 2 * Math.PI;
  const p = ((-Math.PI/2 - rotation) % PI2 + PI2) % PI2;
  for (const seg of layout) if (p >= seg.startAngle && p < seg.endAngle) return seg;
  return layout[0];
}

function fitRadialText(text, maxWidth, startSize, minSize) {
  let fs = startSize;
  ctx.font = '800 ' + fs + "px 'Nunito', sans-serif";
  while (ctx.measureText(text).width > maxWidth && fs > minSize) {
    fs -= 0.5;
    ctx.font = '800 ' + fs + "px 'Nunito', sans-serif";
  }
  let out = text;
  if (ctx.measureText(out).width > maxWidth) {
    while (out.length > 2 && ctx.measureText(out + '\u2026').width > maxWidth) out = out.slice(0, -1);
    out += '\u2026';
  }
  return { text: out, fontSize: fs };
}

function drawWheel(rotation) {
  const W = canvasSize, dpr = canvas._dpr || 1;
  const OUTER_R = W/2 - 2, RING_W = W * 0.022, R = OUTER_R - RING_W;

  ctx.clearRect(0, 0, W * dpr, W * dpr);
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.translate(W/2, W/2);

  ctx.beginPath(); ctx.arc(0,0,OUTER_R,0,2*Math.PI); ctx.fillStyle = '#111'; ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,OUTER_R,0,2*Math.PI); ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,R+1,0,2*Math.PI);     ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1.5; ctx.stroke();

  const activeSeg = wheelSpinning ? getSegmentAtPointer(segLayout, rotation) : null;
  for (const seg of segLayout) {
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.arc(0, 0, R, seg.startAngle + rotation, seg.endAngle + rotation);
    ctx.closePath();
    ctx.fillStyle = seg.color; ctx.fill();
    if (seg === activeSeg) { ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill(); }
    else if (!wheelSpinning && winnerSeg && seg !== winnerSeg) { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fill(); }
    ctx.strokeStyle = 'rgba(212,168,32,0.55)'; ctx.lineWidth = 1.4; ctx.stroke();
  }

  const hubR = W * 0.115, textEndR = hubR + 16, textStartR = R - 8;
  const radialSpace = textStartR - textEndR;

  for (const seg of segLayout) {
    if (seg.endAngle - seg.startAngle < 0.02) continue;
    ctx.save();
    ctx.rotate(seg.centerAngle + rotation);
    const base = Math.max(10, Math.min(19, W * 0.054));
    const fitted = fitRadialText(seg.label, radialSpace - 4, base, 8);
    ctx.font = '800 ' + fitted.fontSize + "px 'Nunito', sans-serif";
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const tw = ctx.measureText(fitted.text).width;
    const x = textEndR + Math.max(0, (radialSpace - tw) / 2);
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(fitted.text, x, 0);
    ctx.restore();
  }

  const dropTip = -(hubR + W * 0.030), dropW = hubR * 0.38;
  ctx.beginPath();
  ctx.moveTo(-dropW/2, -hubR*0.55);
  ctx.bezierCurveTo(-dropW/2, -hubR*0.85, -dropW*0.18, dropTip+2, 0, dropTip);
  ctx.bezierCurveTo( dropW*0.18, dropTip+2,  dropW/2, -hubR*0.85,  dropW/2, -hubR*0.55);
  ctx.closePath();
  ctx.fillStyle = '#1e1e1e'; ctx.fill();
  ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 1.5; ctx.stroke();

  ctx.beginPath(); ctx.arc(0,0,hubR,0,2*Math.PI);
  ctx.fillStyle = '#1e1e1e'; ctx.fill();
  ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,hubR*0.6,0,2*Math.PI);
  ctx.fillStyle = '#252525'; ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.stroke();

  ctx.restore();
}

function sizeCanvas() {
  const availW = stage.clientWidth - 24;
  const availH = stage.clientHeight - 128;   // fighter bar above + values below
  // (#phase-sub now reserves a fixed line, so stage height no longer fluctuates)
  canvasSize = Math.max(230, Math.min(400, Math.min(availW, availH)));
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvasSize * dpr; canvas.height = canvasSize * dpr;
  canvas.style.width = canvasSize + 'px'; canvas.style.height = canvasSize + 'px';
  canvas._dpr = dpr;
}

// How far off centre the pointer may stop, as a share of the half-segment.
// 0.7 leaves a 30% margin to each edge, so the pointer can never cross into
// the losing segment — and a narrow segment automatically keeps a small offset.
const POINTER_SPREAD = 0.7;

function randomPointerOffset(seg) {
  const half = (seg.endAngle - seg.startAngle) / 2;
  return (Math.random() * 2 - 1) * half * POINTER_SPREAD;
}

// Guard: an offset is only used if the pointer still reads as the winner.
function safeOffset(seg, offset) {
  if (!offset) return 0;
  const test = -Math.PI / 2 - (seg.centerAngle + offset);
  return getSegmentAtPointer(segLayout, test) === seg ? offset : 0;
}

function spinWheelTo(targetSeg, offset, onDone) {
  const PI2 = 2 * Math.PI;
  const targetCanvas = -Math.PI/2 - (targetSeg.centerAngle + safeOffset(targetSeg, offset));
  let delta = ((targetCanvas - currentRotation) % PI2 + PI2) % PI2;
  let extraTurns = Math.ceil((PI2 * 4 - delta) / PI2);
  if (extraTurns < 0) extraTurns = 0;
  const finalRotation = currentRotation + delta + extraTurns * PI2;
  const totalDist = finalRotation - currentRotation;
  const duration = 3500 + Math.random() * 800;
  const t0 = performance.now(), start = currentRotation;
  let lastSeg = null;

  wheelSpinning = true; winnerSeg = null;

  function frame(now) {
    const t = Math.min(1, (now - t0) / duration);
    const ease = 1 - Math.pow(1 - t, 3);
    currentRotation = start + ease * totalDist;
    const seg = getSegmentAtPointer(segLayout, currentRotation);
    if (seg !== lastSeg) { lastSeg = seg; if (t > 0.01) playSpinTick(Math.min(1, (1 - ease) / 0.3)); }
    drawWheel(currentRotation);
    if (t < 1) { wheelRaf = requestAnimationFrame(frame); }
    else {
      wheelRaf = null;
      currentRotation = finalRotation;
      wheelSpinning = false; winnerSeg = targetSeg;
      drawWheel(currentRotation);
      setTimeout(playLanding, 60);
      onDone && onDone();
    }
  }
  wheelRaf = requestAnimationFrame(frame);
}

function pickWeighted(layout) {
  const total = layout.reduce((s,x) => s + x.weight, 0);
  let r = Math.random() * total;
  for (const seg of layout) { r -= seg.weight; if (r <= 0) return seg; }
  return layout[layout.length - 1];
}

// ═══════════════════════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════════════════════
let busy = false;

// View history. Only display steps are recorded — a draw or a spin clears it,
// so stepping back can never undo a result or put a drawn fighter back.
let viewHistory = [];
function pushHistory() {
  viewHistory.push(JSON.stringify(tourney));
  if (viewHistory.length > 10) viewHistory.shift();
}
function clearHistory() { viewHistory = []; }
function updateBackZone() {
  const z = $('back-zone');
  if (z) z.classList.toggle('off', viewHistory.length === 0);
}
function goBack() {
  if (busy) return;
  if (!viewHistory.length) { toast('Nothing to step back to'); return; }
  tourney = JSON.parse(viewHistory.pop());
  save();
  render();
  toast('Stepped back');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// Shrinks the headline until it fits on one line (narrow phones, long pairs)
function fitTitle() {
  phaseTitle.style.fontSize = '';
  const max = 25, min = 15;
  let fs = max;
  phaseTitle.style.fontSize = fs + 'px';
  let guard = 0;
  while (phaseTitle.scrollWidth > phaseTitle.clientWidth && fs > min && guard++ < 40) {
    fs -= 0.6;
    phaseTitle.style.fontSize = fs + 'px';
  }
}

function showStage(which) {
  reelStage.style.display   = which === 'reel'   ? 'flex' : 'none';
  vsStage.style.display     = which === 'vs'     ? 'flex' : 'none';
  wheelStage.style.display  = which === 'wheel'  ? 'flex' : 'none';
  winnerStage.style.display = which === 'winner' ? 'flex' : 'none';
}

function setDots(m, popIdx, n) {
  const count = n || 3;
  if (fbDots.children.length !== count) {
    fbDots.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div');
      d.className = 'rdot';
      d.dataset.i = i;
      fbDots.appendChild(d);
    }
  }
  fbDots.classList.toggle('five', count > 3);
  for (let i = 0; i < count; i++) {
    const el = fbDots.children[i];
    const r = m.res[i];
    if (!r) { el.className = 'rdot'; el.style.background = '#131313'; el.style.boxShadow = 'none'; }
    else {
      const col = sideMark(r);
      el.style.background = col;
      el.style.boxShadow = '0 0 12px ' + col;
      el.className = 'rdot filled';
      if (i === popIdx) { void el.offsetWidth; el.className = 'rdot filled justfilled'; }
    }
  }
}

function renderFighterBar(m, pulseSide) {
  const A = champById(m.a), B = champById(m.b);
  const s = matchScore(m);
  const elA = $('fb-a'), elB = $('fb-b');
  elA.textContent = A ? A.name : '\u2014';
  elB.textContent = B ? B.name : '\u2014';
  // The name carries the side colour so it maps straight onto the wheel.
  elA.style.color = sideMark('a');
  elB.style.color = sideMark('b');
  elA.style.textShadow = '0 0 14px ' + sideMark('a') + '55';
  elB.style.textShadow = '0 0 14px ' + sideMark('b') + '55';
  $('fb-score').textContent = (s.a || s.b) ? (s.a + ' \u2013 ' + s.b) : 'VS';
  elA.className = 'fb-name';
  elB.className = 'fb-name r';
  if (pulseSide) {
    const el = pulseSide === 'a' ? elA : elB;
    void el.offsetWidth;
    el.className = 'fb-name' + (pulseSide === 'b' ? ' r' : '') + ' pulse';
  }
}

function trialIdxFromPhase(p) {
  const hit = /^t([1-5])(show|done)$/.exec(p || '');
  return hit ? Number(hit[1]) - 1 : -1;
}

function renderVS(m) {
  const A = champById(m.a), B = champById(m.b);
  const side = (c, sd) => {
    const g = tierGlow(c ? c.tier : 'Common'), tc = tierColor(c ? c.tier : 'Common');
    return '<div class="vs-strip" style="background:' + sideMark(sd) + '"></div>' +
      '<div class="vs-name" style="color:' + sideMark(sd) + '">' + esc(c ? c.name : '\u2014') + '</div>' +
      '<div class="vs-race" style="color:' + g + '">' + esc(c ? (c.race || '\u2014') : '\u2014') + '</div>' +
      '<span class="vs-tier" style="background:' + tc.bg + ';color:' + tc.text + '">' + esc(c ? c.tier : '') + '</span>';
  };
  $('vs-a').innerHTML = side(A, 'a');
  $('vs-b').innerHTML = side(B, 'b');

  const gA = sideMark('a'), gB = sideMark('b');
  const nT = trialCountOf(m, curRound());
  $('vs-trials').className = nT > 3 ? 'five' : '';
  $('vs-trials').innerHTML = orderOf(m, nT).map((oi, i) => {
    const t = TRIALS[oi];
    const s = m.sums[i], share = m.w[i];
    const pa = Math.round(share * 100);
    return '<div class="vs-trial">' +
      '<div class="vs-trial-head">' +
        '<span class="vs-trial-name">Spin ' + (i+1) +
          (i === nT - 1 && nT > 3 ? ' \u00b7 decider' : '') + '</span>' +
        '<span class="vs-trial-stats">' + esc(t.title) + '</span>' +
      '</div>' +
      '<div class="vs-bar-row">' +
        '<span class="vs-val" style="color:' + gA + '">' + s.a + '</span>' +
        '<span class="vs-bar">' +
          '<span style="width:' + pa + '%;background:' + gA + '"></span>' +
          '<span style="width:' + (100 - pa) + '%;background:' + gB + '"></span>' +
        '</span>' +
        '<span class="vs-val r" style="color:' + gB + '">' + s.b + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

function renderWheelValues(m, ti) {
  const s = m.sums ? m.sums[ti] : { a:0, b:0 };
  const pa = Math.round((m.w ? m.w[ti] : 0.5) * 100);
  wheelValues.innerHTML =
    '<div class="wv-col"><div class="wv-num" style="color:' + sideMark('a') + '">' + s.a + '</div>' +
      '<div class="wv-pct">' + pa + '%</div></div>' +
    '<div class="wv-vs">VS</div>' +
    '<div class="wv-col"><div class="wv-num" style="color:' + sideMark('b') + '">' + s.b + '</div>' +
      '<div class="wv-pct">' + (100 - pa) + '%</div></div>';
}

function updateLocator() {
  if (!tourney) {
    locator.textContent = champions.length >= 2
      ? champions.length + ' champions ready' : 'No champions yet';
    return;
  }
  if (tourney.done) { locator.textContent = 'Tournament complete'; return; }
  const r = curRound();
  locator.textContent = r.name + ' \u00b7 Match ' + (tourney.mi + 1) + ' of ' + r.matches.length;
}

function btnLabel(m, n) {
  if (m.phase === 'idle') return 'Draw fighter A';
  if (m.phase === 'a')    return 'Draw fighter B';
  if (m.phase === 'b')    return 'Show the matchup';
  if (m.phase === 'vs')   return 'Spin 1 of ' + n;
  if (m.phase === 'end')  return 'Next match';
  const ti = trialIdxFromPhase(m.phase);
  if (ti < 0) return 'Continue';
  if (m.phase.endsWith('show')) return 'Spin';
  if (isDecided(m, n) || ti + 1 >= n) return 'Reveal the winner';
  return 'Spin ' + (ti + 2) + ' of ' + n;
}

function render(opts) {
  opts = opts || {};
  updateLocator();
  updateBackZone();

  if (!tourney) {
    showStage('reel');
    phaseEyebrow.textContent = 'Wheel of Origin';
    phaseTitle.textContent = 'Season 1';
    phaseSub.textContent = champions.length >= 2 ? 'Ready to roll' : 'Add champions in the roster tab';
    reelStrip.innerHTML = '';
    reelCaption.style.color = '';
    reelCaption.textContent = champions.length >= 2 ? 'Tap start to open the bracket' : '';
    fitTitle();
    actionBtn.textContent = 'Start tournament';
    actionBtn.disabled = champions.length < 2;
    return;
  }

  if (tourney.done) {
    const c = champById(tourney.champion);
    showStage('winner');
    phaseEyebrow.textContent = 'Season 1';
    phaseTitle.textContent = 'Champion';
    phaseSub.textContent = tourney.rounds[0].size + ' entered \u00b7 1 remains';
    $('winner-name').textContent = c ? c.name : '\u2014';
    $('winner-race').textContent = c ? (c.race || '\u2014') + ' \u00b7 ' + c.tier : '\u2014';
    $('winner-race').style.color = tierGlow(c ? c.tier : 'Common');
    $('winner-score').textContent = '\u2605';
    $('winner-detail').textContent = 'Wheel of Origin Season 1 Champion';
    fitTitle();
    actionBtn.textContent = 'Reset tournament';
    actionBtn.disabled = false;
    return;
  }

  const r = curRound(), m = curMatch();
  const A = champById(m.a), B = champById(m.b);
  const nTrials = trialCountOf(m, r);
  actionBtn.textContent = btnLabel(m, nTrials);
  actionBtn.disabled = false;

  // ── Draw phases
  if (m.phase === 'idle' || m.phase === 'a' || m.phase === 'b') {
    showStage('reel');
    if (m.phase === 'idle') {
      phaseEyebrow.textContent = 'Drawing';
      phaseTitle.textContent = 'Fighter A';
      phaseSub.textContent = r.pool.length + ' left in the pool';
      setReelStatic(r.pool, r.pool[0]);
      reelCaption.style.color = '';
      reelCaption.textContent = '';
      fitTitle();
    } else {
      const c = m.phase === 'a' ? A : B;
      phaseEyebrow.textContent = m.phase === 'a' ? 'Locked in' : 'Both fighters set';
      phaseTitle.textContent = m.phase === 'a' ? 'Fighter A' : 'Fighter B';
      phaseSub.textContent = r.pool.length + ' left in the pool';
      showReelLocked(m.phase === 'a' ? m.a : m.b);
      reelCaption.textContent = c ? c.tier.toUpperCase() + ' \u00b7 POWER ' + powerOf(c) : '';
      reelCaption.style.color = tierGlow(c ? c.tier : 'Common');
    }
    fitTitle();
    return;
  }

  // ── Matchup card
  if (m.phase === 'vs') {
    showStage('vs');
    vsStage.classList.toggle('five', trialCountOf(m, r) > 3);
    phaseEyebrow.textContent = 'Best of ' + (trialCountOf(m, r) === 5 ? 'five' : 'three');
    phaseTitle.textContent = 'The Matchup';
    phaseSub.textContent = '';
    fitTitle();
    renderVS(m);
    return;
  }

  // ── Spin wheel
  const ti = trialIdxFromPhase(m.phase);
  if (ti >= 0) {
    const t = trialAt(m, ti, nTrials);
    showStage('wheel');
    phaseEyebrow.textContent = 'Spin ' + (ti + 1) + ' of ' + nTrials;
    phaseTitle.textContent = t.title;
    phaseSub.textContent = '';
    fitTitle();
    renderFighterBar(m, opts.pulseSide);
    setDots(m, opts.popIdx, nTrials);
    buildTrialLayout(m, ti);
    sizeCanvas();
    if (m.phase.endsWith('done') && m.res[ti]) {
      winnerSeg = segLayout.find(s => s.side === m.res[ti]);
      const off = (m.off && typeof m.off[ti] === 'number') ? m.off[ti] : 0;
      currentRotation = -Math.PI / 2 - (winnerSeg.centerAngle + safeOffset(winnerSeg, off));
    } else {
      winnerSeg = null;
    }
    wheelSpinning = false;
    drawWheel(currentRotation);
    renderWheelValues(m, ti);
    return;
  }

  // ── Match winner
  if (m.phase === 'end') {
    const s2 = matchScore(m);
    const wid = matchWinnerId(m);
    const w = champById(wid);
    const lost = (wid === m.a) ? B : A;
    const nextSize = Math.floor(r.size / 2);
    showStage('winner');
    phaseEyebrow.textContent = 'Best of ' + (trialCountOf(m, r) === 5 ? 'five' : 'three');
    phaseTitle.textContent = 'Winner';
    phaseSub.textContent = '';
    fitTitle();
    $('winner-name').textContent = w ? w.name : '\u2014';
    $('winner-race').textContent = w ? (w.race || '\u2014') + ' \u00b7 ' + w.tier : '\u2014';
    $('winner-race').style.color = tierGlow(w ? w.tier : 'Common');
    $('winner-score').textContent = Math.max(s2.a, s2.b) + ' : ' + Math.min(s2.a, s2.b);
    const spun = m.res.filter(Boolean).length;
    $('winner-detail').innerHTML =
      'Decided in ' + spun + ' spin' + (spun === 1 ? '' : 's') + '<br>' +
      (lost ? 'Eliminates ' + esc(lost.name) + '<br>' : '') +
      (nextSize >= 2 ? 'Advances to the ' + roundFullName(nextSize) : 'Crowned champion');
  }
}

// ── Step control ───────────────────────────────────────────────────
function advance() {
  if (busy) return;
  initAudio();

  if (!tourney) { if (startTournament()) render(); return; }

  if (tourney.done) {
    if (confirm('Reset the tournament? All matches and results are lost. The roster stays.')) {
      tourney = null; save(); render();
    }
    return;
  }

  const r = curRound(), m = curMatch();

  if (m.phase === 'idle' || m.phase === 'a') {
    const slot = m.phase === 'idle' ? 'a' : 'b';
    if (!r.pool.length) return;
    const pick = r.pool[Math.floor(Math.random() * r.pool.length)];
    const snapshot = r.pool.slice();

    busy = true; actionBtn.disabled = true;
    showStage('reel');
    phaseEyebrow.textContent = 'Drawing';
    phaseTitle.textContent = slot === 'a' ? 'Fighter A' : 'Fighter B';
    phaseSub.textContent = r.pool.length + ' left in the pool';
    reelCaption.textContent = ''; reelCaption.style.color = '';

    spinReel(snapshot, pick, () => {
      m[slot] = pick;
      r.pool = r.pool.filter(x => x !== pick);
      m.phase = slot;
      if (m.a && m.b) computeMatchWeights(m, trialCountFor(r.size));
      busy = false; clearHistory(); save(); render();
    });
    return;
  }

  if (m.phase === 'b')      { pushHistory(); m.phase = 'vs';     save(); render(); return; }
  if (m.phase === 'vs')     { pushHistory(); m.phase = 't1show'; save(); render(); return; }
  const nT = trialCountOf(m, r);
  const doneIdx = trialIdxFromPhase(m.phase);
  if (doneIdx >= 0 && m.phase.endsWith('done')) {
    pushHistory();
    m.phase = (isDecided(m, nT) || doneIdx + 1 >= nT) ? 'end' : ('t' + (doneIdx + 2) + 'show');
    save(); render(); return;
  }

  const ti = trialIdxFromPhase(m.phase);
  if (ti >= 0 && m.phase.endsWith('show')) {
    busy = true; actionBtn.disabled = true;
    buildTrialLayout(m, ti);
    const target = pickWeighted(segLayout);
    const offset = randomPointerOffset(target);
    spinWheelTo(target, offset, () => {
      m.res[ti] = target.side;
      if (!m.off) m.off = [0, 0, 0];
      m.off[ti] = safeOffset(target, offset);
      m.phase = 't' + (ti + 1) + 'done';
      busy = false; clearHistory(); save();
      render({ pulseSide: target.side, popIdx: ti });
    });
    return;
  }

  if (m.phase === 'end') {
    pushHistory();
    if (tourney.mi < r.matches.length - 1) tourney.mi++;
    else if (buildNextRoundIfReady()) { tourney.ri++; tourney.mi = 0; }
    else {
      const winners = r.matches.map(mm => matchWinnerId(mm)).filter(Boolean).concat(r.pool);
      tourney.done = true;
      tourney.champion = winners[0] || null;
    }
    save(); render();
  }
}

// ── ROSTER ─────────────────────────────────────────────────────────

      '<label class="check-row"><input type="checkbox" id="chk-shift"' + (shiftTiersOnImport ? ' checked' : '') + '>' +

      '<div class="btn-row">' +
        '<button class="btn gold" id="btn-import-ls">From browser storage</button>' +
        '<button class="btn gold" id="btn-import-file">Load JSON file</button>' +
      '</div>' +
      '<input type="file" id="file-input" accept="application/json,.json" style="display:none">' +

    '</div>' +

    '<div class="sec">' +
      '<div class="sec-label">Paste rows</div>' +

      '<div class="btn-row">' +
        '<button class="btn gold" id="btn-bulk-add">Add</button>' +
        '<button class="btn" id="btn-bulk-replace">Replace roster</button>' +
      '</div>' +
      '<div class="msg neutral" id="bulk-msg"></div>' +
    '</div>' +

    '<div class="sec">' +
      '<div class="sec-label">Roster \u2014 ' + champions.length + ' champions</div>' +
      (tourney ? '<div class="hint">A tournament is running. Roster changes only apply to the next one.</div>' : '') +
      '<div id="champ-list"></div>' +
      '<div class="btn-row">' +
        '<button class="btn gold" id="btn-add-one">Add one</button>' +

function renderChampList() {
  const wrap = $('champ-list');
  if (!wrap) return;
  if (!champions.length) {
    wrap.innerHTML = '<div class="empty-note">No champions yet.<br>Import, paste rows, or add one by hand.</div>';
    return;

      '</div>' +
      '<div class="champ-pow">' + powerOf(c) + '</div>' +

// ── IMPORT ─────────────────────────────────────────────────────────
// Rarity always comes from the base race, never the subrace.
let shiftTiersOnImport = true;

function fromGeneratorRecord(rec) {
  const st = rec.stats || rec;
  const tiers = rec.tiers || {};
  const raceTier = normTier(tiers.race || rec.raceTier || rec.tier);
  const finalTier = shiftTiersOnImport ? shiftTier(raceTier) : raceTier;
  return {
    id: newId(),
    name: String(rec.name || 'Unnamed Champion'),
    race: String(rec.race || rec.subrace || '\u2014'),
    tier: finalTier,
    _shifted: finalTier !== raceTier,
    STR: Number(st.STR) || 0, IQ: Number(st.IQ) || 0, SPD: Number(st.SPD) || 0,
    DUR: Number(st.DUR) || 0, PM: Number(st.PM) || 0, DEF: Number(st.DEF) || 0,
  };
}

function ingest(list, msgEl) {
  const arr = Array.isArray(list) ? list : (list && Array.isArray(list.champions) ? list.champions : null);
  if (!arr) { setMsg(msgEl, 'No champion list found in that file.', 'err'); return; }
  const added = arr.map(fromGeneratorRecord).filter(c => c.name);
  if (!added.length) { setMsg(msgEl, 'That list is empty.', 'err'); return; }
  champions = champions.concat(added);
  save();
  const moved = added.filter(c => c._shifted).length;
  added.forEach(c => { delete c._shifted; });
  const note = 'Imported ' + added.length + '. Roster: ' + champions.length + '.' +
    (moved ? ' ' + moved + ' shifted up a tier (Trash\u2192Common, Common\u2192Uncommon).' : '');
  renderRoster();
  setMsg($('import-msg'), note, 'ok');
  render();
}

function importFromLocalStorage() {
  const msg = $('import-msg');
  let raw = null;
  try { raw = localStorage.getItem(GENERATOR_KEY); } catch (e) { raw = null; }
  if (!raw) { setMsg(msg, 'Nothing in browser storage. Export the JSON from the generator and load the file instead.', 'err'); return; }
  try { ingest(JSON.parse(raw), msg); }
  catch (e) { setMsg(msg, 'The stored data could not be read.', 'err'); }
}

function handleFileImport(ev) {
  const msg = $('import-msg');
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try { ingest(JSON.parse(fr.result), msg); }
    catch (e) { setMsg(msg, 'That file is not valid JSON.', 'err'); }
  };
  fr.onerror = () => setMsg(msg, 'The file could not be read.', 'err');
  fr.readAsText(file);
  ev.target.value = '';
}

// ── PASTE ROWS ─────────────────────────────────────────────────────
function parseBulk(text) {
  const out = [], errors = [];
  text.split(/\r?\n/).forEach((line, i) => {
    const raw = line.trim();
    if (!raw) return;
    const parts = raw.split(/\t|;|,/).map(p => p.trim()).filter((p, idx, a) => !(p === '' && idx === a.length - 1));
    if (parts.length < 9) { errors.push('line ' + (i + 1) + ': ' + parts.length + ' fields instead of 9'); return; }
    const nums = parts.slice(3, 9).map(v => Number(String(v).replace(',', '.')));
    if (nums.some(n => !isFinite(n))) { errors.push('line ' + (i + 1) + ': stats are not numbers'); return; }
    out.push({
      id: newId(), name: parts[0], race: parts[1] || '\u2014', tier: normTier(parts[2]),
      STR: nums[0], IQ: nums[1], SPD: nums[2], DUR: nums[3], PM: nums[4], DEF: nums[5],
    });
  });
  return { out, errors };
}

function applyBulk(replace) {
  const text = $('bulk-input').value;
  if (!text.trim()) { setMsg($('bulk-msg'), 'The box is empty.', 'err'); return; }
  const parsed = parseBulk(text);
  if (!parsed.out.length) {
    setMsg($('bulk-msg'), 'No valid line found. ' + parsed.errors.slice(0,3).join(' \u00b7 '), 'err');
    return;
  }
  champions = replace ? parsed.out : champions.concat(parsed.out);
  save();
  const skipped = parsed.errors.length ? ' Skipped ' + parsed.errors.length + ': ' + parsed.errors.slice(0,2).join(' \u00b7 ') : '';
  const summary = 'Added ' + parsed.out.length + '. Roster: ' + champions.length + '.' + skipped;
  renderRoster();
  setMsg($('bulk-msg'), summary, parsed.errors.length ? 'neutral' : 'ok');
  render();
}

// ── EDITOR ─────────────────────────────────────────────────────────
let editId = null;
function openEditor(id) {
  editId = id;
  const c = id ? champById(id) : { name:'', race:'', tier:'Common', STR:0, IQ:0, SPD:0, DUR:0, PM:0, DEF:0 };
  if (!c) return;
  $('edit-body').innerHTML =
    '<div class="field"><label>Name</label><input type="text" id="e-name" value="' + esc(c.name) + '"></div>' +
    '<div class="field"><label>Race</label><input type="text" id="e-race" value="' + esc(c.race) + '"></div>' +
    '<div class="field"><label>Tier</label><select id="e-tier">' +
      TIER_LIST.map(t => '<option value="' + t + '"' + (t === c.tier ? ' selected' : '') + '>' + t + '</option>').join('') +
    '</select></div>' +
    '<div class="sec-label" style="margin-top:16px;">Stats</div>' +
    '<div class="stat-grid">' +
      STAT_KEYS.map(k => '<div class="stat-cell"><label>' + k + '</label><input type="number" inputmode="numeric" id="e-' + k + '" value="' + (Number(c[k]) || 0) + '"></div>').join('') +
    '</div>' +
    '<div class="btn-row" style="margin-top:18px;"><button class="btn gold full" id="e-save">Save</button></div>' +
    (id ? '<div class="btn-row"><button class="btn danger full" id="e-del">Delete champion</button></div>' : '') +
    '<div class="msg neutral" id="e-msg"></div>';

  $('e-save').onclick = () => {
    const name = $('e-name').value.trim();
    if (!name) { setMsg($('e-msg'), 'The name is missing.', 'err'); return; }
    const data = { name, race: $('e-race').value.trim() || '\u2014', tier: normTier($('e-tier').value) };
    STAT_KEYS.forEach(k => { data[k] = Number($('e-' + k).value) || 0; });
    if (editId) {
      const idx = champions.findIndex(x => x.id === editId);
      if (idx >= 0) champions[idx] = Object.assign({}, champions[idx], data);
    } else {
      champions.push(Object.assign({ id: newId() }, data));
    }
    save(); openPanel('champions'); render();
  };
  if (id) $('e-del').onclick = () => {
    if (!confirm('Delete "' + c.name + '"?')) return;
    champions = champions.filter(x => x.id !== id);
    save(); openPanel('champions'); render();
  };
  openPanel('edit');
}

// ── BRACKET ────────────────────────────────────────────────────────
function renderBracket() {
  const body = $('bracket-body');
  if (!tourney) {
    body.innerHTML = '<div class="empty-note">No tournament yet.<br>Build the roster, then start it in the arena.</div>';
    return;
  }

  const sizes = plannedSizes();
  const curSize = tourney.done ? 0 : curRound().size;
  let html = '<div id="br-rail">' + sizes.map((n, i) => {
    const cls = n === curSize ? 'now' : (n > curSize ? 'past' : '');
    return (i ? '<span class="rail-sep">\u25b8</span>' : '') +
      '<div class="rail-pill ' + cls + '">' + roundShortName(n) + '</div>';
  }).join('') + '</div>';

  sizes.forEach(size => {
    const ri = tourney.rounds.findIndex(r => r.size === size);
    const r = ri >= 0 ? tourney.rounds[ri] : null;
    const done = r ? r.matches.filter(m => m.phase === 'end').length : 0;
    const total = r ? r.matches.length : Math.floor(size / 2);

    html += '<div class="br-round-head"' + (r ? ' data-ri="' + ri + '"' : '') + '>' +
      '<div class="br-round-name gold-text"' + (r ? '' : ' style="opacity:0.35"') + '>' + roundFullName(size) + '</div>' +
      '<div class="br-round-prog">' + (r ? done + ' / ' + total : 'upcoming') + '</div>' +
    '</div>';

    if (!r) return;

    html += r.matches.map((m, mi) => {
      const A = champById(m.a), B = champById(m.b);
      const s = matchScore(m);
      const wid = m.phase === 'end' ? matchWinnerId(m) : null;
      const isCur = (ri === tourney.ri && mi === tourney.mi && !tourney.done);
      return '<div class="match-row' + (isCur ? ' current' : '') + '" data-ri="' + ri + '" data-mi="' + mi + '">' +
        '<div class="match-no">' + (mi + 1) + '</div>' +
        '<div class="match-side' + (wid && wid !== m.a ? ' loser' : '') + '" style="color:' + (A ? tierGlow(A.tier) : '#555') + '">' + (A ? esc(A.name) : '\u2014') + '</div>' +
        '<div class="match-sep">VS</div>' +
        '<div class="match-side' + (wid && wid !== m.b ? ' loser' : '') + '" style="text-align:right;color:' + (B ? tierGlow(B.tier) : '#555') + '">' + (B ? esc(B.name) : '\u2014') + '</div>' +
        '<div class="match-score">' + ((s.a || s.b) ? s.a + ':' + s.b : '') + '</div>' +
      '</div>';
    }).join('');

    if (r.byes && r.byes.length) {
      html += r.byes.map(id => {
        const c = champById(id);
        return '<div class="match-row" style="opacity:0.7"><div class="match-no">\u2014</div>' +
          '<div class="match-side" style="color:' + (c ? tierGlow(c.tier) : '#555') + '">' + (c ? esc(c.name) : '\u2014') + '</div>' +
          '<div class="match-score">BYE</div></div>';
      }).join('');
    }
  });

  if (tourney.done) {
    const c = champById(tourney.champion);
    html += '<div class="br-round-head"><div class="br-round-name gold-text">Champion</div></div>' +
      '<div class="match-row" style="border-color:rgba(200,160,50,0.75)">' +
      '<div class="match-no">\u2605</div><div class="match-side" style="color:' + (c ? tierGlow(c.tier) : '#fff') + '">' +
      (c ? esc(c.name) : '\u2014') + '</div></div>';
  }

  html += '<div class="btn-row" style="margin-top:22px;">' +
    '<button class="btn" id="b-export">Export JSON</button>' +
    '<button class="btn danger" id="b-reset">Reset tournament</button></div>';

  body.innerHTML = html;

  body.querySelectorAll('.match-row[data-mi]').forEach(row => {
    row.onclick = () => {
      tourney.ri = Number(row.dataset.ri);
      tourney.mi = Number(row.dataset.mi);
      tourney.done = false;
      clearHistory(); save(); openPanel(null); render();
    };
  });
  body.querySelectorAll('.br-round-head[data-ri]').forEach(h => {
    h.onclick = () => {
      tourney.ri = Number(h.dataset.ri);
      tourney.mi = 0; tourney.done = false;
      clearHistory(); save(); openPanel(null); render();
    };
  });
  $('b-export').onclick = exportJSON;
  $('b-reset').onclick = () => {
    if (!confirm('Reset the tournament? All matches and results are lost. The roster stays.')) return;
    tourney = null; save(); renderBracket(); render();
  };
}

// ── EXPORT ─────────────────────────────────────────────────────────
function exportJSON() {
  const payload = {
    kind: 'wheel_of_origin_tournament', season: 1,
    exportedAt: new Date().toISOString(), champions, tournament: tourney,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'wheel_of_origin_tournament.json'; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}
